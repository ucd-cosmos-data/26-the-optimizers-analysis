<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#ffffff"/>
  <style>
    .title{font:700 32px Arial,sans-serif;fill:#17212b}
    .subtitle{font:400 15px Arial,sans-serif;fill:#526575}
    .label{font:600 15px Arial,sans-serif;fill:#213b53}
    .small{font:400 13px Arial,sans-serif;fill:#526575}
    .value{font:700 21px Arial,sans-serif;fill:#102a43}
    .tick{font:400 13px Arial,sans-serif;fill:#526575}
  </style>

  <!-- summary cards -->
  <rect x="70" y="125" width="260" height="108" fill="#ffffff"/>
  <text x="92" y="157" class="small">Mean held-out score</text>
  <text x="92" y="198" class="value">0.2378</text>
  <rect x="350" y="125" width="260" height="108" fill="#ffffff"/>
  <text x="372" y="157" class="small">Mean positive fraction</text>
  <text x="372" y="198" class="value">0.2086</text>
  <rect x="630" y="125" width="260" height="108" fill="#ffffff"/>
  <text x="652" y="157" class="small">Patients above baseline</text>
  <text x="652" y="198" class="value">8 of 14</text>
  <rect x="910" y="125" width="350" height="108" fill="#ffffff"/>
  <text x="932" y="157" class="small">Archived Gen1 diagnostic</text>
  <text x="932" y="188" class="label">5-minute AUROC: 0.912</text>
  <text x="932" y="210" class="small">PN00-only; not comparable to the final cohort</text>

  <!-- chart -->
  <rect x="70" y="275" width="1190" height="515" fill="#ffffff" stroke="#aebdca"/>
  <text x="105" y="316" class="label">Held-out performance by patient (n = 14)</text>
  <text x="1190" y="316" class="small" text-anchor="end">Bars: model score; dots: prevalence baseline</text>
  <line x1="125" y1="710" x2="1205" y2="710" stroke="#9ba7af"/>
  <line x1="125" y1="610" x2="1205" y2="610" stroke="#e7ebed"/>
  <line x1="125" y1="510" x2="1205" y2="510" stroke="#e7ebed"/>
  <line x1="125" y1="410" x2="1205" y2="410" stroke="#e7ebed"/>
  <line x1="125" y1="360" x2="1205" y2="360" stroke="#e7ebed"/>
  <text x="115" y="715" class="tick" text-anchor="end">0.0</text>
  <text x="115" y="615" class="tick" text-anchor="end">0.2</text>
  <text x="115" y="515" class="tick" text-anchor="end">0.4</text>
  <text x="115" y="415" class="tick" text-anchor="end">0.6</text>
  <text x="115" y="365" class="tick" text-anchor="end">0.7</text>
  <!-- bars: scale 500 px per score unit, baseline y=710 -->
  <g fill="#23637d">
    <rect x="145" y="597.95" width="48" height="112.05" rx="4"/><rect x="220" y="502.92" width="48" height="207.08" rx="4"/>
    <rect x="295" y="636.43" width="48" height="73.57" rx="4"/><rect x="370" y="585.45" width="48" height="124.55" rx="4"/>
    <rect x="445" y="621.92" width="48" height="88.08" rx="4"/><rect x="520" y="606.22" width="48" height="103.78" rx="4"/>
    <rect x="595" y="554.16" width="48" height="155.84" rx="4"/><rect x="670" y="584.43" width="48" height="125.57" rx="4"/>
    <rect x="745" y="631.59" width="48" height="78.41" rx="4"/><rect x="820" y="528.76" width="48" height="181.24" rx="4"/>
    <rect x="895" y="549.42" width="48" height="160.58" rx="4"/><rect x="970" y="599.78" width="48" height="110.22" rx="4"/>
    <rect x="1045" y="648.63" width="48" height="61.37" rx="4"/><rect x="1120" y="627.95" width="48" height="82.05" rx="4"/>
  </g>
  <!-- baseline dots -->
  <g fill="#c85f3d" stroke="#ffffff" stroke-width="2">
    <circle cx="169" cy="549.74" r="7"/><circle cx="244" cy="610" r="7"/><circle cx="319" cy="610" r="7"/><circle cx="394" cy="610" r="7"/>
    <circle cx="469" cy="610" r="7"/><circle cx="544" cy="610" r="7"/><circle cx="619" cy="610" r="7"/><circle cx="694" cy="610" r="7"/>
    <circle cx="769" cy="610" r="7"/><circle cx="844" cy="610" r="7"/><circle cx="919" cy="610" r="7"/><circle cx="994" cy="610" r="7"/>
    <circle cx="1069" cy="610" r="7"/><circle cx="1144" cy="610" r="7"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="169" y="744">PN00</text><text x="244" y="744">PN01</text><text x="319" y="744">PN03</text><text x="394" y="744">PN05</text>
    <text x="469" y="744">PN06</text><text x="544" y="744">PN07</text><text x="619" y="744">PN09</text><text x="694" y="744">PN10</text>
    <text x="769" y="744">PN11</text><text x="844" y="744">PN12</text><text x="919" y="744">PN13</text><text x="994" y="744">PN14</text>
    <text x="1069" y="744">PN16</text><text x="1144" y="744">PN17</text>
  </g>
  <rect x="150" y="765" width="16" height="16" rx="3" fill="#3d7891"/><text x="175" y="778" class="small">Gen1 ranking score</text>
  <circle cx="305" cy="773" r="7" fill="#d47b45"/><text x="322" y="778" class="small">Positive-rate baseline</text>
  <text x="1205" y="778" class="small" text-anchor="end">Source: final_project/results/final/tables/k_finder_patient_scores.csv</text>
  <text x="70" y="850" class="subtitle">Figure. Gen1 full-montage held-out performance. Values are macro-averaged across patients; the baseline is each patient’s sampled positive fraction.</text>
</svg>
